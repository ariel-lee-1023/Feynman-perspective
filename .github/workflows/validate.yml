name: Package structure and optional release gate
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Run full release gate (candidate may fail)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: persona
      - uses: actions/checkout@v4
        with:
          repository: ariel-lee-1023/persona-distiller
          ref: b57edf4706065fef3fc520dd1521c3d66650b6a6
          path: validator
      - name: Validate current package structure
        run: python3 validator/scripts/validate_package.py persona --strict --headings persona/fidelity-ledger/required-headings.txt
      - name: Check JSON and exclude raw/private inputs
        run: |
          python3 - <<'PYCODE'
          import json,pathlib,subprocess
          for path in pathlib.Path('persona').rglob('*.json'):
              json.loads(path.read_text())
          files=subprocess.check_output(['git','-C','persona','ls-files','-z']).decode().split('\0')
          assert not any(any(part in {'raw','corpus','private','_work'} for part in pathlib.PurePosixPath(f).parts) or f.endswith(('.pdf','.png','.tiff')) for f in files if f)
          PYCODE
      - name: Install release validator dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python3 -m pip install -r validator/requirements-release.txt
      - name: Enforce full release evidence
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python3 validator/scripts/validate_package.py persona --release
