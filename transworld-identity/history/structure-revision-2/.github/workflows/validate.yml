name: Candidate package and evidence integrity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: persona
      - uses: actions/checkout@v4
        with:
          repository: ariel-lee-1023/persona-distiller
          ref: a010b3ed320a6edf7273d1510908c9540501f6dc
          path: validator
      - name: Validate package structure
        run: python3 validator/scripts/validate_package.py persona --strict --headings persona/transworld-identity/required-headings.txt
      - name: Check Candidate status and evidence integrity
        run: python3 persona/scripts/check_release.py
